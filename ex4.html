<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       div {
    display: block;
    margin-right: 15px;
    width: 90px;
    height: 30px;
    background-color: rgb(86, 76, 215);
    border: 1px solid;
    text-align: center;
    color: white;
    border-radius: 10px;
    cursor: pointer; 
    transition: transform 0.3s ease; 
}

div:hover {
    transform: scale(1.1); 
}
    </style>
</head>
<body>
    <div class="div">Cliquer</div>
</body>
</html>
