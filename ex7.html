<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            font-size:20px;
            animation: flou 2s ease-in-out;
        }
        @keyframes flou{
            0%{
                filter: blur(5px);
                opacity: 0;
            }
            100%{
                filter: blur(0px);
                opacity: 3;
            }
        }
        
    </style>
</head>
<body>
    <div class="div1">Bienvenue dans l'annimation CSS</div>
</body>
</html>
