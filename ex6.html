<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
         div {
            width: 90px;
            height: 90px;
            background-color: rgb(247, 4, 4);
            border-radius: 50px;
            animation: effetZoom 3s infinite ease-in-out;
        }
        @keyframes effetZoom {
            0% {
                transform: scale(1); 
            }
            50% {
                transform: scale(1.4); 
            }
            100% {
                transform: scale(1); 
            }
        }
    </style>
</head>
<body>
     <div class="div1"></div>
</body>
</html>
